<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="t">Curva emocional de Camila en CaféU versión 1</title>
  <desc id="d">Ocho etapas del recorrido con puntuaciones de menos dos a más dos. Las caídas están en la confirmación con producto agotado y en la espera del envío.</desc>
  <rect width="800" height="360" fill="#faf6f0"/>
  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#3e2723">Curva emocional de Camila (hipótesis del equipo, versión 1)</text>

  <!-- ejes y cuadrícula: y = 190 es el cero; cada punto de escala = 50 px -->
  <g stroke="#d9c9b8" stroke-width="1">
    <line x1="70" y1="90" x2="770" y2="90"/>
    <line x1="70" y1="140" x2="770" y2="140"/>
    <line x1="70" y1="190" x2="770" y2="190" stroke="#8d7b6c" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="70" y1="240" x2="770" y2="240"/>
    <line x1="70" y1="290" x2="770" y2="290"/>
  </g>
  <g font-size="12" fill="#6d4c41" text-anchor="end">
    <text x="62" y="94">+2</text><text x="62" y="144">+1</text><text x="62" y="194">0</text>
    <text x="62" y="244">−1</text><text x="62" y="294">−2</text>
  </g>

  <!-- zonas de momentos de verdad -->
  <rect x="150" y="36" width="150" height="274" fill="#fff4e0" opacity="0.8"/>
  <text x="225" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#9f2d08">Momento de verdad 1</text>
  <rect x="405" y="36" width="245" height="274" fill="#fff4e0" opacity="0.8"/>
  <text x="527" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#9f2d08">Momento de verdad 2</text>

  <!-- curva: x = 100 + 85*i ; y = 190 - 50*valor -->
  <polyline fill="none" stroke="#bf360c" stroke-width="3" stroke-linejoin="round"
    points="100,140 185,90 270,190 355,240 440,290 525,240 610,90 695,140"/>
  <g fill="#bf360c" stroke="#fff" stroke-width="2">
    <circle cx="100" cy="140" r="7"/><circle cx="185" cy="90" r="7"/><circle cx="270" cy="190" r="7"/>
    <circle cx="355" cy="240" r="7"/><circle cx="440" cy="290" r="7"/><circle cx="525" cy="240" r="7"/>
    <circle cx="610" cy="90" r="7"/><circle cx="695" cy="140" r="7"/>
  </g>

  <!-- etiquetas de puntuación -->
  <g font-size="12" font-weight="700" fill="#3e2723" text-anchor="middle">
    <text x="100" y="126">+1</text><text x="185" y="76">+2</text><text x="270" y="176">0</text>
    <text x="355" y="262">−1</text><text x="440" y="312">−2</text><text x="525" y="262">−1</text>
    <text x="610" y="76">+2</text><text x="695" y="126">+1</text>
  </g>

  <!-- etapas -->
  <g font-size="11" fill="#3e2723" text-anchor="middle">
    <text x="100" y="334">TP1 Inicio</text>
    <text x="185" y="334">TP2 Menú y</text><text x="185" y="347">búsqueda</text>
    <text x="270" y="334">TP3 Detalle</text>
    <text x="355" y="334">TP4 Armado</text><text x="355" y="347">del pedido</text>
    <text x="440" y="334">TP5 Producto</text><text x="440" y="347">agotado</text>
    <text x="525" y="334">TP5 Espera</text><text x="525" y="347">del envío</text>
    <text x="610" y="334">TP6 Confirmación</text>
    <text x="695" y="334">TP8 Retiro</text>
  </g>
</svg>
