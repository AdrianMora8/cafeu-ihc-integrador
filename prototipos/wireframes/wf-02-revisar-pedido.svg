<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Wireframe 2: Revisar el pedido</title>
  <desc id="d">Pantalla Mi pedido con aviso, líneas con selector de cantidad y botón Quitar, total, formulario de nombre y hora, y botón de confirmar, con notas explicativas.</desc>
  <style>
    .t{font-size:13px;fill:#222}.b{font-weight:700}.s{font-size:11px;fill:#555}.h{font-size:19px;font-weight:700;fill:#222}
    .box{fill:#fff;stroke:#444;stroke-width:1.5}.ph{fill:#e6e6e6;stroke:#9a9a9a}.btn{fill:#fff;stroke:#444;stroke-width:2}
    .pri{fill:#333;stroke:#333}.note{font-size:13px;fill:#222}.num{fill:#bf360c}.numt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
  </style>
  <rect width="780" height="660" fill="#fafafa"/>
  <text x="20" y="16" class="s">Wireframe 2 de 3 · Mi pedido (#/pedido) · RF-03, RF-04, RF-05</text>

  <rect x="20" y="24" width="360" height="620" rx="26" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="44" y="62" class="t b">☕ CaféU</text>
  <rect x="268" y="42" width="96" height="28" rx="14" class="btn"/><text x="316" y="61" class="t b" text-anchor="middle">Mi pedido (3)</text>
  <line x1="20" y1="82" x2="380" y2="82" stroke="#bbb"/>
  <rect x="40" y="94" width="96" height="4" fill="#ccc"/><rect x="146" y="94" width="96" height="4" fill="#333"/><rect x="252" y="94" width="96" height="4" fill="#ccc"/>
  <text x="194" y="112" class="s" text-anchor="middle">Pedido</text>

  <text x="40" y="140" class="h">Revisa tu pedido</text>
  <!-- aviso -->
  <rect x="40" y="150" width="320" height="34" rx="10" fill="#f0f0f0" stroke="#777"/><text x="52" y="172" class="t">Café americano agregado al pedido.</text>

  <!-- línea 1 -->
  <rect x="40" y="194" width="320" height="104" rx="14" class="box"/>
  <rect x="52" y="206" width="44" height="44" rx="10" class="ph"/>
  <text x="108" y="224" class="t b">Café americano</text><text x="108" y="242" class="t b">$1.50</text>
  <rect x="52" y="258" width="38" height="30" rx="8" class="btn"/><text x="71" y="279" class="h" text-anchor="middle">−</text>
  <text x="112" y="279" class="t b" text-anchor="middle">2</text>
  <rect x="128" y="258" width="38" height="30" rx="8" class="pri"/><text x="147" y="279" class="h" text-anchor="middle" style="fill:#fff">+</text>
  <text x="338" y="279" class="t b" text-anchor="end" text-decoration="underline">Quitar</text>
  <!-- línea 2 -->
  <rect x="40" y="306" width="320" height="104" rx="14" class="box"/>
  <rect x="52" y="318" width="44" height="44" rx="10" class="ph"/>
  <text x="108" y="336" class="t b">Sanduche de queso</text><text x="108" y="354" class="t b">$2.75</text>
  <rect x="52" y="370" width="38" height="30" rx="8" class="btn"/><text x="71" y="391" class="h" text-anchor="middle">−</text>
  <text x="112" y="391" class="t b" text-anchor="middle">1</text>
  <rect x="128" y="370" width="38" height="30" rx="8" class="btn"/><text x="147" y="391" class="h" text-anchor="middle">+</text>
  <text x="338" y="391" class="t b" text-anchor="end" text-decoration="underline">Quitar</text>

  <rect x="40" y="418" width="320" height="34" rx="12" class="box"/><text x="54" y="440" class="t">Total</text><text x="346" y="440" class="t b" text-anchor="end">$5.75</text>

  <text x="40" y="474" class="t b">Nombre para el pedido</text>
  <rect x="40" y="480" width="320" height="32" rx="8" class="box"/><text x="52" y="501" class="s">Escribe tu nombre</text>
  <text x="40" y="530" class="t b">Hora de retiro</text>
  <rect x="40" y="536" width="320" height="32" rx="8" class="box"/><text x="52" y="557" class="s">Elige una hora ▾</text>
  <rect x="40" y="578" width="320" height="34" rx="12" class="pri"/><text x="200" y="600" class="t b" text-anchor="middle" style="fill:#fff">Confirmar pedido</text>
  <rect x="40" y="618" width="320" height="20" rx="10" class="btn" opacity="0.0"/>

  <g><circle cx="388" cy="167" r="11" class="num"/><text x="388" y="171" class="numt">1</text>
     <circle cx="388" cy="276" r="11" class="num"/><text x="388" y="280" class="numt">2</text>
     <circle cx="388" cy="276" r="0" class="num"/>
     <circle cx="388" cy="435" r="11" class="num"/><text x="388" y="439" class="numt">3</text>
     <circle cx="388" cy="520" r="11" class="num"/><text x="388" y="524" class="numt">4</text>
     <circle cx="388" cy="595" r="11" class="num"/><text x="388" y="599" class="numt">5</text></g>

  <g transform="translate(420 70)">
    <text class="note b" y="0">Notas de diseño</text>
    <text class="note" y="30">1. Aviso de resultado ("agregado", "se quitó")</text><text class="s" y="46">con foco, para que se lea y se anuncie. Muestra</text><text class="s" y="60">"Deshacer" cuando se quitó un producto (RF-04).</text>
    <text class="note" y="96">2. Selector − / + agrupado y separado de</text><text class="note" y="112">"Quitar" para evitar toques accidentales (RF-03).</text><text class="s" y="128">Los botones se deshabilitan en 1 y en 9.</text>
    <text class="note" y="164">3. Total visible antes de confirmar.</text><text class="s" y="180">Reconocer en lugar de recordar (Nielsen 6).</text>
    <text class="note" y="216">4. Campos con etiqueta visible y ayuda.</text><text class="s" y="232">El error aparece junto al campo (ver estados).</text>
    <text class="note" y="268">5. Una acción principal por pantalla.</text><text class="s" y="284">"Confirmar pedido" lleva a "Enviando pedido".</text>
    <text class="note b" y="340">Estados de esta pantalla</text>
    <text class="s" y="360">• Pedido vacío: mensaje y botón "Ir al menú".</text>
    <text class="s" y="376">• Datos inválidos: resumen de errores con foco.</text>
    <text class="s" y="392">• Producto agotado al confirmar: dos caminos.</text>
    <text class="s" y="408">• Cantidad en el límite: botón deshabilitado.</text>
  </g>
</svg>
