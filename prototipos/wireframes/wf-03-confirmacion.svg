<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 660" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Wireframe 3: Pedido confirmado</title>
  <desc id="d">Pantalla de confirmación con ícono de éxito, número de pedido, resumen y tres acciones: cambiar hora, cancelar pedido y volver al menú, con notas explicativas.</desc>
  <style>
    .t{font-size:13px;fill:#222}.b{font-weight:700}.s{font-size:11px;fill:#555}.h{font-size:19px;font-weight:700;fill:#222}
    .box{fill:#fff;stroke:#444;stroke-width:1.5}.ph{fill:#e6e6e6;stroke:#9a9a9a}.btn{fill:#fff;stroke:#444;stroke-width:2}
    .danger{fill:#fff;stroke:#222;stroke-width:2;stroke-dasharray:6 3}.note{font-size:13px;fill:#222}.num{fill:#bf360c}.numt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
  </style>
  <rect width="780" height="660" fill="#fafafa"/>
  <text x="20" y="16" class="s">Wireframe 3 de 3 · Pedido confirmado (#/confirmacion) · RF-05, RF-06</text>

  <rect x="20" y="24" width="360" height="620" rx="26" fill="#fff" stroke="#222" stroke-width="3"/>
  <text x="44" y="62" class="t b">☕ CaféU</text>
  <rect x="268" y="42" width="96" height="28" rx="14" class="btn"/><text x="316" y="61" class="t b" text-anchor="middle">Mi pedido (0)</text>
  <line x1="20" y1="82" x2="380" y2="82" stroke="#bbb"/>
  <rect x="40" y="94" width="96" height="4" fill="#ccc"/><rect x="146" y="94" width="96" height="4" fill="#ccc"/><rect x="252" y="94" width="96" height="4" fill="#333"/>
  <text x="300" y="112" class="s" text-anchor="middle">Listo</text>

  <circle cx="200" cy="158" r="30" fill="#fff" stroke="#222" stroke-width="3"/><path d="M185 158 l11 11 l20 -22" fill="none" stroke="#222" stroke-width="4"/>
  <text x="200" y="214" class="h" text-anchor="middle">¡Pedido confirmado!</text>
  <rect x="40" y="226" width="320" height="58" rx="12" fill="#f0f0f0" stroke="#777"/>
  <text x="200" y="248" class="s" text-anchor="middle">Número de pedido</text><text x="200" y="272" class="h" text-anchor="middle">#CU-104</text>

  <rect x="40" y="296" width="320" height="156" rx="14" class="box"/>
  <text x="54" y="318" class="t b">Resumen</text>
  <text x="54" y="340" class="t">2 × Café americano</text><text x="54" y="360" class="t">1 × Sanduche de queso</text>
  <line x1="54" y1="372" x2="346" y2="372" stroke="#999" stroke-dasharray="4 3"/>
  <text x="54" y="392" class="t">Total</text><text x="346" y="392" class="t b" text-anchor="end">$5.75</text>
  <text x="54" y="418" class="s">Retira a nombre de Ana a las 11:00.</text>

  <rect x="40" y="466" width="320" height="38" rx="12" class="btn"/><text x="200" y="490" class="t b" text-anchor="middle">Cambiar hora de retiro</text>
  <rect x="40" y="514" width="320" height="38" rx="12" class="danger"/><text x="200" y="538" class="t b" text-anchor="middle">Cancelar pedido</text>
  <rect x="40" y="562" width="320" height="38" rx="12" class="btn"/><text x="200" y="586" class="t b" text-anchor="middle">Volver al menú</text>

  <g><circle cx="388" cy="158" r="11" class="num"/><text x="388" y="162" class="numt">1</text>
     <circle cx="388" cy="262" r="11" class="num"/><text x="388" y="266" class="numt">2</text>
     <circle cx="388" cy="374" r="11" class="num"/><text x="388" y="378" class="numt">3</text>
     <circle cx="388" cy="485" r="11" class="num"/><text x="388" y="489" class="numt">4</text>
     <circle cx="388" cy="533" r="11" class="num"/><text x="388" y="537" class="numt">5</text></g>

  <g transform="translate(420 70)">
    <text class="note b" y="0">Notas de diseño</text>
    <text class="note" y="30">1. Ícono de éxito más el texto "confirmado":</text><text class="s" y="46">el estado no depende solo del color (Nielsen 1).</text>
    <text class="note" y="82">2. Número de pedido grande: es lo que se</text><text class="note" y="98">muestra en el mostrador al retirar (MV2).</text>
    <text class="note" y="134">3. Resumen con productos, total, nombre y hora.</text><text class="s" y="150">Reconocer en lugar de recordar (Nielsen 6).</text>
    <text class="note" y="186">4. Cambiar la hora no obliga a rehacer el pedido.</text><text class="s" y="202">Control y libertad del usuario (Nielsen 3).</text>
    <text class="note" y="238">5. Acción destructiva con borde distinto y</text><text class="note" y="254">diálogo de confirmación; luego se puede restaurar.</text>
    <text class="note b" y="310">Estados relacionados</text>
    <text class="s" y="330">• Cambiar hora: error si es la misma hora.</text>
    <text class="s" y="346">• Cancelado: aviso y botón "Restaurar pedido".</text>
    <text class="s" y="362">• Sin pedido confirmado: mensaje y "Ir al menú".</text>
    <text class="s" y="378">• Tras recargar la página el pedido se conserva.</text>
  </g>
</svg>
